services:
  postgres:
    image: postgres:16-alpine
    container_name: udlms-postgres
    environment:
      POSTGRES_USER: udlms
      POSTGRES_PASSWORD: udlms
      POSTGRES_DB: udlms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: udlms-api
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://udlms:udlms@postgres:5432/udlms?schema=public
      JWT_SECRET: change_me_in_production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: udlms-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
